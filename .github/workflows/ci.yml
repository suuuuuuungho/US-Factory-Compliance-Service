name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  rules:
    name: 이름 규칙 검사
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BRANCH: ${{ github.head_ref }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v6
      # 규칙 원본: [1] docs/4) workflow/2_rules.md (4번, 10번)
      - name: 브랜치 이름 + PR 제목 + 설계 파일
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          branch = os.environ["BRANCH"]
          title = os.environ["TITLE"]
          errors = []

          if not re.fullmatch(r"(feat|fix|test|chore|docs)/suu-[0-9]+-[a-z0-9-]+", branch):
              errors.append(f"브랜치 이름 위반: '{branch}'  →  예: feat/suu-20-ecfr-ingest")

          if not re.fullmatch(r"(feat|fix|test|chore|docs)\((db|rag|backend|frontend|ci)\): .{1,40} \(SUU-[0-9]+\)", title):
              errors.append(f"PR 제목 위반: '{title}'  →  예: feat(db): eCFR Part 63 원문을 Supabase에 적재 (SUU-20)")

          # 설계 파일 첫 줄 = PR 제목 (SUU-45). 브랜치의 suu-N 으로 [5] tickets/<영역>/<종류>/SUU-N.md 를 찾는다
          m_branch = re.search(r"suu-([0-9]+)", branch)
          m_title = re.search(r"\(SUU-([0-9]+)\)$", title)
          if m_branch and m_title and m_branch.group(1) != m_title.group(1):
              errors.append(f"번호 불일치: 브랜치 suu-{m_branch.group(1)} vs 제목 (SUU-{m_title.group(1)})")
          if m_branch:
              n = m_branch.group(1)
              found = list(pathlib.Path("[5] tickets").rglob(f"SUU-{n}.md"))
              if not found:
                  errors.append(f"설계 파일 없음: [5] tickets/<영역>/<종류>/SUU-{n}.md  →  모든 PR에 설계 파일이 있어야 한다 (chore/docs도)")
              else:
                  design = found[0]
                  first = design.read_text(encoding="utf-8-sig").splitlines()[0].strip()
                  m_first = re.fullmatch(rf"# SUU-{n} (.+)", first)
                  if not m_first:
                      errors.append(f"설계 파일 첫 줄 위반: '{first}'  →  예: # SUU-{n} feat(db): 문장")
                  else:
                      expected = f"{m_first.group(1).strip()} (SUU-{n})"
                      if title != expected:
                          errors.append(f"PR 제목이 설계 파일 첫 줄과 다름  기대: '{expected}'  실제: '{title}'")

          for e in errors:
              print(f"::error::{e}")
          if errors:
              print("규칙: [1] docs/4) workflow/2_rules.md")
              sys.exit(1)
          print(f"OK  브랜치: {branch}\nOK  제목:   {title}\nOK  설계 파일 첫 줄과 같음")
          PY

  tests:
    name: 테스트 (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 설치
        run: |
          pip install -q pytest
          [ ! -f requirements.txt ] || pip install -q -r requirements.txt
      - name: pytest (테스트가 0개면 통과)
        run: python -m pytest || [ $? -eq 5 ]

  contracts:
    name: 데이터 계약 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 설치
        run: pip install -q -r requirements.txt
      # 규칙 원본: [2] db/contracts/*.odcs.yaml (SUU-269)
      - name: YAML 계약 vs 실제 DB
        run: python "[2] db/contracts/contract_check.py"

  frontend:
    name: 프론트 (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "[4]frontend"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "[[]4]frontend/package-lock.json"
      - run: npm ci
      - run: npm test

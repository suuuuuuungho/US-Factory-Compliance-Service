# SUU-160: Render Blueprint. main merge마다 자동 배포. 무료 플랜(512MB, 15분 안 쓰면 잠듦 → 첫 요청 30~60초).
# rootDir은 안 쓴다: app.main이 "[2] db/pipeline/5_rag"의 ecfr_* 모듈을 import 하므로 레포 루트에서 PYTHONPATH로 잇는다(pyproject.toml pythonpath와 같은 생각).
services:
  - type: web
    name: us-factory-compliance-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: PYTHONPATH
        value: "[3] backend:[2] db/pipeline/5_rag"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ISAACUS_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: http://localhost:3000

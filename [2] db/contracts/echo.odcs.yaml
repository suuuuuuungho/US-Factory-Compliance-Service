# ECHO — 시설·점검·위반·처분
# 데이터 계약 (ODCS v3.1.0). 쉬운 설명: [1] docs/2) db/db overview/Data Specification_v1.md
# 버전 규칙: 칸 추가 = 1.x.0 / 칸 삭제·뜻 변경 = x.0.0 / 설명만 고침 = 1.0.x
apiVersion: v3.1.0
kind: DataContract
id: us-factory-compliance-echo
name: ECHO — 시설·점검·위반·처분
version: 1.0.1
status: active
domain: air-compliance
description:
  purpose: EPA ICIS-Air 전국 자료와 CAA Pipeline. '어떤 시설이 무엇을 어겨 얼마를 냈나'를 답할 때 쓴다
  usage: 쉬운 설명은 [1] docs/2) db/db overview/Data Specification_v1.md 를 본다
  limitations: 행 수는 customProperties.rowCount 기준일 값이다. 새 release를 적재하면 바뀐다
servers:
- server: supabase
  type: postgresql
  environment: prod
  host: db.husqnrcuoaogdkbpjnep.supabase.co
  port: 5432
  database: postgres
  schema: public
schema:
- name: echo_activity
  physicalName: echo_activity
  physicalType: table
  logicalType: object
  description: 점검·굴뚝시험·Title V 인증·공식처분·비공식처분을 한 표에 담는다
  properties:
  - name: release_id
    logicalType: string
    physicalType: uuid
    description: 이 행이 속한 적재 묶음(release) 번호. common_dataset_release.release_id
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: activity_kind
    logicalType: string
    physicalType: text
    description: 활동 종류. inspection / stack_test / titlev / formal / informal
    required: true
    primaryKey: true
    primaryKeyPosition: 2
  - name: activity_id
    logicalType: string
    physicalType: text
    description: ECHO 활동 번호. activity_kind 와 함께 써야 하나로 정해진다
    required: true
    primaryKey: true
    primaryKeyPosition: 3
  - name: type_code
    logicalType: string
    physicalType: text
    description: 활동 세부 종류 코드
    required: false
  - name: type_desc
    logicalType: string
    physicalType: text
    description: 활동 세부 종류 설명
    required: false
  - name: lead_flag
    logicalType: string
    physicalType: text
    description: 주관 기관 표시 (주정부 / EPA)
    required: false
  - name: monitor_code
    logicalType: string
    physicalType: text
    description: 점검 방식 코드
    required: false
  - name: monitor_desc
    logicalType: string
    physicalType: text
    description: 점검 방식 설명
    required: false
  - name: activity_date
    logicalType: date
    physicalType: date
    description: 활동 날짜. 1900년 전·2100년 후 가짜 날짜는 빈값으로 바꿨다. 원본 글자는 raw_date
    required: false
  - name: raw_date
    logicalType: string
    physicalType: text
    description: 원본 날짜 글자 그대로
    required: false
  - name: attributes
    logicalType: object
    physicalType: jsonb
    description: 표 칸으로 뽑지 않은 나머지 원본 값 (JSON)
    required: false
  relationships:
  - type: foreignKey
    from: echo_activity.release_id
    to: common_dataset_release.release_id
  quality:
  - name: not_empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    description: 적재된 표는 비어 있으면 안 된다
    dimension: completeness
    severity: error
  - type: text
    description: activity_date 가 1900-01-01 전이거나 2100-01-01 이후면 안 된다. 가짜 날짜는 빈값으로 둔다
    severity: warning
  - type: text
    description: activity_id 만으로는 하나로 정해지지 않는다. 항상 activity_kind 와 같이 쓴다
    severity: warning
  customProperties:
  - property: rowCount
    value: 3242036
    description: 2026-09-24 기준 실제 행 수 (count(*))
- name: echo_activity_facility
  physicalName: echo_activity_facility
  physicalType: table
  logicalType: object
  description: 활동과 시설의 연결
  properties:
  - name: release_id
    logicalType: string
    physicalType: uuid
    description: 이 행이 속한 적재 묶음(release) 번호. common_dataset_release.release_id
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: activity_kind
    logicalType: string
    physicalType: text
    description: 활동 종류. inspection / stack_test / titlev / formal / informal
    required: true
    primaryKey: true
    primaryKeyPosition: 2
  - name: activity_id
    logicalType: string
    physicalType: text
    description: ECHO 활동 번호. activity_kind 와 함께 써야 하나로 정해진다
    required: true
    primaryKey: true
    primaryKeyPosition: 3
  - name: pgm_sys_id
    logicalType: string
    physicalType: text
    description: ECHO 시설 번호 (ICIS-Air 기준). ECHO 표끼리 잇는 열쇠
    required: true
    primaryKey: true
    primaryKeyPosition: 4
  relationships:
  - type: foreignKey
    from:
    - echo_activity_facility.release_id
    - echo_activity_facility.activity_kind
    - echo_activity_facility.activity_id
    to:
    - echo_activity.release_id
    - echo_activity.activity_kind
    - echo_activity.activity_id
  - type: foreignKey
    from:
    - echo_activity_facility.release_id
    - echo_activity_facility.pgm_sys_id
    to:
    - echo_facility.release_id
    - echo_facility.pgm_sys_id
  quality:
  - name: not_empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    description: 적재된 표는 비어 있으면 안 된다
    dimension: completeness
    severity: error
  customProperties:
  - property: rowCount
    value: 3246696
    description: 2026-09-24 기준 실제 행 수 (count(*))

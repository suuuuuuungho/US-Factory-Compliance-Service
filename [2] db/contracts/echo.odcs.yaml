    required: false
  - name: cfr_part
    logicalType: string
    physicalType: text
    description: CFR Part 번호
    required: false
  - name: cfr_subpart
    logicalType: string
    physicalType: text
    description: CFR Subpart 글자
    required: false
  - name: source_url
    logicalType: string

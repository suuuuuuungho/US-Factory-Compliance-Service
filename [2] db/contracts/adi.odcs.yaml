  quality:
  - name: not_empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    description: 적재된 표는 비어 있으면 안 된다
    dimension: completeness
    severity: error
  customProperties:
  - property: rowCount
    value: 31
    description: 2026-09-24 기준 실제 행 수 (count(*))

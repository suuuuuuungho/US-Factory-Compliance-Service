  - name: list_sha256
    logicalType: string
    physicalType: text
    description: 목록 원본 지문
    required: true
  - name: source_object_id
    logicalType: string
    physicalType: uuid
    description: 이 행의 원본 파일 번호. common_raw_object.object_id
    required: false
  - name: scope_status
    logicalType: string
    physicalType: text
    description: Part 63 관련인지. part63_candidate / out_of_scope
    required: true

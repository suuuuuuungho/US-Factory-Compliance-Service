    primaryKeyPosition: 2
  - name: echo_pgm_sys_id
    logicalType: string
    physicalType: text
    description: 후보 ECHO 시설 번호
    required: true
    primaryKey: true
    primaryKeyPosition: 3
  - name: match_evidence
    logicalType: string
    physicalType: text
    description: 후보로 본 근거
    required: false
  - name: review_status
    logicalType: string
    physicalType: text
    description: 사람 검토 상태. 기계가 자동으로 확정하지 않는다

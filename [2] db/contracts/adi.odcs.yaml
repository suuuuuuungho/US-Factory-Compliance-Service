- name: adi_source_entry
  physicalName: adi_source_entry
  physicalType: table
  logicalType: object
  description: ADI·CAA Dashboard 목록의 한 행
  properties:
  - name: release_id
    logicalType: string
    physicalType: uuid
    description: 이 행이 속한 적재 묶음(release) 번호. common_dataset_release.release_id
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: source_system
    logicalType: string
    physicalType: text
    description: 어디 목록에서 왔나. adi / caa_dashboard
    required: true
    primaryKey: true
    primaryKeyPosition: 2
  - name: source_key
    logicalType: string
    physicalType: text
    description: 목록 행 열쇠. ADI는 control_number
    required: true
    primaryKey: true
    primaryKeyPosition: 3
  - name: control_number
    logicalType: string
    physicalType: text
    description: ADI 관리 번호. Dashboard는 비어 있다

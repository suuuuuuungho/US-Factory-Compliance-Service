    required: false
  - name: title
    logicalType: string
    physicalType: text
    description: 회신 제목
    required: false
  - name: categories
    logicalType: object
    physicalType: jsonb
    description: '분류 목록. 예: [MACT, NESHAP]. Dashboard는 []'
    required: true
  - name: office
    logicalType: string
    physicalType: text
    description: 회신한 EPA 부서
    required: false
  - name: author
    logicalType: string
    physicalType: text
    description: 작성자
    required: false
  - name: recipient
    logicalType: string
    physicalType: text
    description: 받는 사람
    required: false
  - name: letter_date_raw
    logicalType: string
    physicalType: text
    description: 목록에 적힌 날짜 글자 그대로
    required: false
  - name: link_text
    logicalType: string
    physicalType: text
    description: Dashboard 링크 글자. 날짜가 아니다
    required: false
  - name: affected_subpart_raw
    logicalType: string
    physicalType: text
    description: Dashboard 'Affected Subpart' 원본 글자
    required: false
  - name: abstract
    logicalType: string
    physicalType: text
    description: 요약
    required: false
  - name: source_url
    logicalType: string
    physicalType: text
    description: 원본을 받은 주소

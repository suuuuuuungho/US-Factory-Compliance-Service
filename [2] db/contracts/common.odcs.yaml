# Common — 적재 운영 기록
# 데이터 계약 (ODCS v3.1.0). 쉬운 설명: [1] docs/2) db/db overview/Data Specification_v1.md
# 버전 규칙: 칸 추가 = 1.x.0 / 칸 삭제·뜻 변경 = x.0.0 / 설명만 고침 = 1.0.x
apiVersion: v3.1.0
kind: DataContract
id: us-factory-compliance-common
name: Common — 적재 운영 기록
version: 1.0.0
status: active
domain: air-compliance
description:
  purpose: 모든 자료가 같이 쓰는 실행 기록·원본 파일·release 표. '이 데이터는 언제 어디서 받았나'를 답한다
  usage: 쉬운 설명은 [1] docs/2) db/db overview/Data Specification_v1.md 를 본다
  limitations: 행 수는 customProperties.rowCount 기준일 값이다. 새 release를 적재하면 바뀐다
servers:
- server: supabase
  type: postgresql
  environment: prod
  host: db.husqnrcuoaogdkbpjnep.supabase.co
  port: 5432
  database: postgres
  schema: public
schema:
- name: common_change_log
  physicalName: common_change_log
  physicalType: table
  logicalType: object
  description: release 사이 변경 기록. (비어 있음)
  properties:
  - name: change_id
    logicalType: string
    physicalType: uuid
    description: 변경 기록 번호
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: event_key
    logicalType: string
    physicalType: text
    description: 같은 변경을 두 번 적지 않기 위한 열쇠
    required: true
  - name: run_id
    logicalType: string
    physicalType: uuid
    description: 이 행을 만든 적재 실행 번호. common_ingest_run.run_id
    required: true
  - name: dataset
    logicalType: string
    physicalType: text
    description: 자료 이름. ecfr / fr / echo / adi
    required: true
  - name: source_key
    logicalType: string
    physicalType: text
    description: 바뀐 원본 항목의 열쇠
    required: true
  - name: change_type
    logicalType: string
    physicalType: text
    description: 변경 종류 (추가 / 수정 / 삭제)
    required: true
  - name: old_release_id
    logicalType: string
    physicalType: uuid
    description: 바뀌기 전 release
    required: false
  - name: new_release_id
    logicalType: string
    physicalType: uuid
    description: 바뀐 뒤 release
    required: true
  - name: old_hash
    logicalType: string
    physicalType: text
    description: 바뀌기 전 지문
    required: false
  - name: new_hash
    logicalType: string
    physicalType: text
    description: 바뀐 뒤 지문
    required: false
  - name: detected_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 변경을 찾은 시각
    required: true
  - name: delivery_status
    logicalType: string
    physicalType: text
    description: 알림 전달 상태
    required: false
  relationships:
  - type: foreignKey
    from: common_change_log.old_release_id
    to: common_dataset_release.release_id
  - type: foreignKey
    from: common_change_log.run_id
    to: common_ingest_run.run_id
  - type: foreignKey
    from: common_change_log.new_release_id
    to: common_dataset_release.release_id
  customProperties:
  - property: rowCount
    value: 0
    description: 2026-09-24 기준 실제 행 수 (count(*))
- name: common_dataset_current
  physicalName: common_dataset_current
  physicalType: table
  logicalType: object
  description: 자료마다 지금 쓰는 release를 가리키는 표
  properties:
  - name: dataset
    logicalType: string
    physicalType: text
    description: 자료 이름. ecfr / fr / echo / adi
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: scope_key
    logicalType: string
    physicalType: text
    description: '적재 범위 이름. 예: 40/63 (Title 40 Part 63)'
    required: true
    primaryKey: true
    primaryKeyPosition: 2
  - name: release_id
    logicalType: string
    physicalType: uuid
    description: 지금 서비스가 쓰는 release 번호. 여기만 보면 최신이 어디인지 안다
    required: true
  - name: last_checked_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 마지막으로 새 자료가 있는지 확인한 시각
    required: true
  - name: latest_source_as_of
    logicalType: date
    physicalType: date
    description: 가장 최신 원본 기준일
    required: false
  relationships:
  - type: foreignKey
    from: common_dataset_current.release_id
    to: common_dataset_release.release_id
  quality:
  - name: not_empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    description: 적재된 표는 비어 있으면 안 된다
    dimension: completeness
    severity: error
  customProperties:
  - property: rowCount
    value: 4
    description: 2026-09-24 기준 실제 행 수 (count(*))
- name: common_dataset_release
  physicalName: common_dataset_release
  physicalType: table
  logicalType: object
  description: 적재 묶음(release). 한 번 공개하면 바꾸지 않는다
  properties:
  - name: release_id
    logicalType: string
    physicalType: uuid
    description: 이 행이 속한 적재 묶음(release) 번호. common_dataset_release.release_id
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: dataset
    logicalType: string
    physicalType: text
    description: 자료 이름. ecfr / fr / echo / adi
    required: true
  - name: scope_key
    logicalType: string
    physicalType: text
    description: '적재 범위 이름. 예: 40/63 (Title 40 Part 63)'
    required: true
  - name: run_id
    logicalType: string
    physicalType: uuid
    description: 이 행을 만든 적재 실행 번호. common_ingest_run.run_id
    required: true
  - name: source_as_of
    logicalType: date
    physicalType: date
    description: 원본 자료 기준일
    required: false
  - name: manifest_hash
    logicalType: string
    physicalType: text
    description: 이 release에 든 원본 목록의 지문
    required: true
  - name: parser_version
    logicalType: string
    physicalType: text
    description: 원본을 읽은 프로그램 버전
    required: true
  - name: status
    logicalType: string
    physicalType: text
    description: release 상태. published 면 공개됨
    required: true
  - name: published_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 공개한 시각
    required: false
  relationships:
  - type: foreignKey
    from: common_dataset_release.run_id
    to: common_ingest_run.run_id
  quality:
  - name: not_empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    description: 적재된 표는 비어 있으면 안 된다
    dimension: completeness
    severity: error
  customProperties:
  - property: rowCount
    value: 4
    description: 2026-09-24 기준 실제 행 수 (count(*))
- name: common_ingest_checkpoint
  physicalName: common_ingest_checkpoint
  physicalType: table
  logicalType: object
  description: 나눠 받기 진행 위치. (비어 있음)
  properties:
  - name: dataset
    logicalType: string
    physicalType: text
    description: 자료 이름. ecfr / fr / echo / adi
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: scope_key
    logicalType: string
    physicalType: text
    description: '적재 범위 이름. 예: 40/63 (Title 40 Part 63)'
    required: true
    primaryKey: true
    primaryKeyPosition: 2
  - name: partition_key
    logicalType: string
    physicalType: text
    description: 나눠 받는 단위 이름
    required: true
    primaryKey: true
    primaryKeyPosition: 3
  - name: cursor
    logicalType: object
    physicalType: jsonb
    description: 어디까지 받았는지 (JSON)
    required: false
  - name: completed_run_id
    logicalType: string
    physicalType: uuid
    description: 이 단위를 끝낸 실행
    required: false
  - name: completed_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 끝낸 시각
    required: false
  relationships:
  - type: foreignKey
    from: common_ingest_checkpoint.completed_run_id
    to: common_ingest_run.run_id
  customProperties:
  - property: rowCount
    value: 0
    description: 2026-09-24 기준 실제 행 수 (count(*))
- name: common_ingest_error
  physicalName: common_ingest_error
  physicalType: table
  logicalType: object
  description: 적재 오류 기록. (비어 있음 = 오류 없음)
  properties:
  - name: error_id
    logicalType: string
    physicalType: uuid
    description: 오류 번호
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: run_id
    logicalType: string
    physicalType: uuid
    description: 이 행을 만든 적재 실행 번호. common_ingest_run.run_id
    required: true
  - name: object_id
    logicalType: string
    physicalType: uuid
    description: 원본 파일 번호. common_raw_object.object_id
    required: false
  - name: record_locator
    logicalType: string
    physicalType: text
    description: 오류 난 행의 위치
    required: false
  - name: stage
    logicalType: string
    physicalType: text
    description: 오류 난 단계
    required: false
  - name: error_code
    logicalType: string
    physicalType: text
    description: 오류 코드
    required: false
  - name: message
    logicalType: string
    physicalType: text
    description: 오류 내용
    required: false
  - name: retryable
    logicalType: boolean
    physicalType: boolean
    description: 다시 시도하면 될 수 있는지
    required: false
  - name: resolved_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 해결한 시각
    required: false
  relationships:
  - type: foreignKey
    from: common_ingest_error.object_id
    to: common_raw_object.object_id
  - type: foreignKey
    from: common_ingest_error.run_id
    to: common_ingest_run.run_id
  customProperties:
  - property: rowCount
    value: 0
    description: 2026-09-24 기준 실제 행 수 (count(*))
- name: common_ingest_run
  physicalName: common_ingest_run
  physicalType: table
  logicalType: object
  description: 적재 실행 1번 = 1행
  properties:
  - name: run_id
    logicalType: string
    physicalType: uuid
    description: 이 행을 만든 적재 실행 번호. common_ingest_run.run_id
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: dataset
    logicalType: string
    physicalType: text
    description: 자료 이름. ecfr / fr / echo / adi
    required: true
  - name: scope
    logicalType: object
    physicalType: jsonb
    description: 이번 실행이 가져온 범위 (JSON)
    required: false
  - name: status
    logicalType: string
    physicalType: text
    description: 실행 결과. succeeded / failed
    required: true
  - name: started_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 실행 시작 시각
    required: true
  - name: finished_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 실행 끝난 시각
    required: false
  - name: counts
    logicalType: object
    physicalType: jsonb
    description: 실행 중 센 개수 (JSON)
    required: false
  - name: error_summary
    logicalType: string
    physicalType: text
    description: 실패했을 때 요약
    required: false
  quality:
  - name: not_empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    description: 적재된 표는 비어 있으면 안 된다
    dimension: completeness
    severity: error
  customProperties:
  - property: rowCount
    value: 4
    description: 2026-09-24 기준 실제 행 수 (count(*))
- name: common_raw_object
  physicalName: common_raw_object
  physicalType: table
  logicalType: object
  description: 내려받은 원본 파일 1개 = 1행
  properties:
  - name: object_id
    logicalType: string
    physicalType: uuid
    description: 원본 파일 번호. common_raw_object.object_id
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: run_id
    logicalType: string
    physicalType: uuid
    description: 이 행을 만든 적재 실행 번호. common_ingest_run.run_id
    required: true
  - name: source_url
    logicalType: string
    physicalType: text
    description: 원본을 받은 주소
    required: true
  - name: final_url
    logicalType: string
    physicalType: text
    description: 리다이렉트 후 실제 주소
    required: false
  - name: storage_uri
    logicalType: string
    physicalType: text
    description: 원본 파일을 보관한 위치
    required: false
  - name: sha256
    logicalType: string
    physicalType: text
    description: 파일 내용 지문(sha256). 같으면 같은 파일
    required: true
  - name: byte_size
    logicalType: integer
    physicalType: bigint
    description: 파일 크기 (바이트)
    required: false
  - name: media_type
    logicalType: string
    physicalType: text
    description: '파일 종류. 예: application/pdf'
    required: false
  - name: fetched_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 내려받은 시각
    required: true
  - name: source_modified_at
    logicalType: timestamp
    physicalType: timestamp with time zone
    description: 원본 서버가 알려준 마지막 수정 시각
    required: false
  - name: etag
    logicalType: string
    physicalType: text
    description: 원본 서버가 준 버전 표시(ETag)
    required: false
  relationships:
  - type: foreignKey
    from: common_raw_object.run_id
    to: common_ingest_run.run_id
  quality:
  - name: not_empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    description: 적재된 표는 비어 있으면 안 된다
    dimension: completeness
    severity: error
  customProperties:
  - property: rowCount
    value: 4915
    description: 2026-09-24 기준 실제 행 수 (count(*))
- name: common_release_object
  physicalName: common_release_object
  physicalType: table
  logicalType: object
  description: release와 원본 파일의 연결
  properties:
  - name: release_id
    logicalType: string
    physicalType: uuid
    description: 이 행이 속한 적재 묶음(release) 번호. common_dataset_release.release_id
    required: true
    primaryKey: true
    primaryKeyPosition: 1
  - name: object_id
    logicalType: string
    physicalType: uuid
    description: 원본 파일 번호. common_raw_object.object_id
    required: true
    primaryKey: true
    primaryKeyPosition: 2
  - name: role
    logicalType: string
    physicalType: text
    description: 이 파일이 release에서 맡은 역할
    required: true
  relationships:
  - type: foreignKey
    from: common_release_object.release_id
    to: common_dataset_release.release_id
  - type: foreignKey
    from: common_release_object.object_id
    to: common_raw_object.object_id
  quality:
  - name: not_empty
    type: library
    metric: rowCount
    mustBeGreaterThan: 0
    description: 적재된 표는 비어 있으면 안 된다
    dimension: completeness
    severity: error
  customProperties:
  - property: rowCount
    value: 4915
    description: 2026-09-24 기준 실제 행 수 (count(*))
contractCreatedTs: '2026-09-24T00:00:00Z'
